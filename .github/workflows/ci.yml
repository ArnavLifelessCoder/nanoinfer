name: ci
on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        preset: [debug, asan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: uv sync --locked
      - name: Check log sanitization
        if: runner.os == 'Windows' && matrix.preset == 'debug'
        shell: pwsh
        run: |
          ./tests/test_sanitize_results.ps1
          ./tests/test_diagnostic_process.ps1
      - run: uv run python -m pytest --basetemp="${{ runner.temp }}/pytest" -v
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --verbose --no-tests=error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Check C++ formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs -r uv run clang-format --dry-run --Werror

  tsan:
    # Enable in M5 and label every concurrency test; M1 has no runtime workers.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan -L concurrency --verbose --no-tests=error
